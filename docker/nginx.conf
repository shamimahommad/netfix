server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.html index.php;

    client_max_body_size 8M;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # Block direct HTTP access to internal backend directories, tests, migrations, and uploads
    location ~* ^/backend/(tests|test_.*|database|cron|scripts|lib|config|services|uploads)/ {
        return 404;
    }
    location ~* ^/backend/test_.*\.php$ {
        return 404;
    }

    # Frontend Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend Core PHP REST API routing (supports /api, /api/v1, /backend, /health, /healthcheck, /ping, /status, /payments)
    location ~ ^/(api|backend|health|healthcheck|health-check|ping|status|payments) {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/backend/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 300;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }
}
