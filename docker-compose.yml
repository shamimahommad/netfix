version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=netfix_db
      - DB_USER=netfix_user
      - DB_PASS=SecretPass2026!
      - JWT_SECRET=netfix_super_secret_jwt_key_2026_change_in_prod
      - APP_ENV=production
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:10.11
    environment:
      - MYSQL_ROOT_PASSWORD=RootSecret2026!
      - MYSQL_DATABASE=netfix_db
      - MYSQL_USER=netfix_user
      - MYSQL_PASSWORD=SecretPass2026!
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

volumes:
  db_data:
