<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)" />
      <stop offset="50%" stop-color="rgba(16, 185, 129, 0.2)" />
      <stop offset="100%" stop-color="rgba(99, 102, 241, 0.3)" />
    </linearGradient>

    <!-- Left Pillar Gradient (Cyan to Blue) -->
    <linearGradient id="leftPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="40%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Diagonal Data Beam (Cyan -> Emerald Energy Flow) -->
    <linearGradient id="diagonalBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="30%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Right Pillar Gradient (Emerald to Teal) -->
    <linearGradient id="rightPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Glowing Node Gradient -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </radialGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.25)" />
      <stop offset="50%" stop-color="rgba(16, 185, 129, 0.12)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>

    <!-- Drop Shadows for 3D Depth -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="url(#borderGrad)" stroke-width="3" />

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="256" cy="256" r="200" fill="url(#ambientGlow)" />

  <!-- Subtle Network Grid Lines in Background -->
  <g opacity="0.12" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="4 6">
    <line x1="96" y1="170" x2="416" y2="170" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="342" x2="416" y2="342" />
    <line x1="170" y1="96" x2="170" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="342" y1="96" x2="342" y2="416" />
  </g>

  <!-- Fiber Optic / Signal Wave Arcs in Top-Right Corner -->
  <g opacity="0.85">
    <path d="M 330 110 A 85 85 0 0 1 402 182" fill="none" stroke="#34D399" stroke-width="4.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 345 125 A 65 65 0 0 1 387 167" fill="none" stroke="#00F2FE" stroke-width="5" stroke-linecap="round" opacity="0.75" />
    <path d="M 360 140 A 45 45 0 0 1 372 152" fill="none" stroke="#38BDF8" stroke-width="5.5" stroke-linecap="round" />
  </g>

  <!-- Main NetFix "N" Monogram Group with Shadow -->
  <g filter="url(#shadowFilter)">
    <!-- 1. Left Pillar (Net Backbone) -->
    <path d="M 132 154
             C 132 136, 146 122, 164 122
             C 182 122, 196 136, 196 154
             L 196 358
             C 196 376, 182 390, 164 390
             C 146 390, 132 376, 132 358
             Z" 
          fill="url(#leftPillar)" />

    <!-- 2. Dynamic Diagonal Connector (High-Speed Fiber Bolt / Fix Beam) -->
    <path d="M 164 122
             C 182 122, 196 136, 196 154
             L 348 358
             C 348 376, 334 390, 316 390
             C 298 390, 284 376, 284 358
             L 132 154
             C 132 136, 146 122, 164 122
             Z"
          fill="url(#diagonalBeam)"
          filter="url(#glowEffect)" />

    <!-- 3. Right Pillar (Fix Anchor) -->
    <path d="M 316 154
             C 316 136, 330 122, 348 122
             C 366 122, 380 136, 380 154
             L 380 358
             C 380 376, 366 390, 348 390
             C 330 390, 316 376, 316 358
             Z" 
          fill="url(#rightPillar)" />
  </g>

  <!-- High-Tech Optical Nodes / Fiber Junctions -->
  <!-- Top Left Node -->
  <circle cx="164" cy="154" r="14" fill="#FFFFFF" opacity="0.95" />
  <circle cx="164" cy="154" r="26" fill="url(#nodeGlow)" opacity="0.8" />

  <!-- Bottom Right Node -->
  <circle cx="348" cy="358" r="14" fill="#FFFFFF" opacity="0.95" />
  <circle cx="348" cy="358" r="26" fill="url(#nodeGlow)" opacity="0.8" />

  <!-- Center Laser Spark Accent -->
  <polygon points="256,236 261,251 276,256 261,261 256,276 251,261 236,256 251,251" fill="#FFFFFF" opacity="0.95" />
  <circle cx="256" cy="256" r="12" fill="#00F2FE" opacity="0.75" filter="url(#glowEffect)" />

  <!-- Bottom Left & Top Right Satellite Endpoints -->
  <circle cx="164" cy="358" r="9" fill="#38BDF8" opacity="0.8" />
  <circle cx="348" cy="154" r="9" fill="#34D399" opacity="0.9" />
</svg>