<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <!-- Pillar Gradients -->
    <linearGradient id="lightLeftPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="lightBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="lightRightPillar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Text Accent Gradient for FIX -->
    <linearGradient id="lightFixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Radial Glow for Icon Base -->
    <radialGradient id="lightIconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="lightLogoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <style>
    .font-brand {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <!-- Left Icon Mark (Centered at X=100, Y=100) -->
  <g transform="translate(25, 25)">
    <!-- Icon Box Squircle (150x150, Transparent glassmorphic) -->
    <rect x="0" y="0" width="150" height="150" rx="36" ry="36" fill="rgba(15, 23, 42, 0.04)" stroke="rgba(15, 23, 42, 0.12)" stroke-width="1.5" />
    <circle cx="75" cy="75" r="60" fill="url(#lightIconGlow)" />

    <!-- Signal Arcs -->
    <path d="M 98 38 A 28 28 0 0 1 122 62" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
    <path d="M 103 44 A 20 20 0 0 1 116 57" fill="none" stroke="#0284C7" stroke-width="3" stroke-linecap="round" />

    <!-- N Symbol inside Icon -->
    <g filter="url(#lightLogoShadow)">
      <!-- Left Pillar -->
      <rect x="36" y="44" width="18" height="66" rx="9" fill="url(#lightLeftPillar)" />
      <!-- Diagonal Connector -->
      <path d="M 45 44 L 105 110 L 87 110 L 36 53 Z" fill="url(#lightBeam)" />
      <!-- Right Pillar -->
      <rect x="96" y="44" width="18" height="66" rx="9" fill="url(#lightRightPillar)" />
    </g>

    <!-- High-tech Nodes -->
    <circle cx="45" cy="53" r="5" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
    <circle cx="105" cy="101" r="5" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
    <circle cx="75" cy="77" r="3.5" fill="#0284C7" />
  </g>

  <!-- Typography: NetFix -->
  <g class="font-brand" transform="translate(210, 0)">
    <!-- "Net" in Ultra-Bold Slate 900 -->
    <text x="0" y="112" font-size="78" font-weight="900" fill="#0F172A" letter-spacing="-1.5">Net</text>

    <!-- "Fix" in Radiant Gradient -->
    <text x="146" y="112" font-size="78" font-weight="900" fill="url(#lightFixGrad)" letter-spacing="-1.5">Fix</text>

    <!-- Spark / Pulse on the "i" in Fix -->
    <circle cx="217" cy="56" r="6.5" fill="#0284C7" />
    <circle cx="217" cy="56" r="11" fill="none" stroke="#10B981" stroke-width="2" opacity="0.8" />

    <!-- Subtitle / Tagline -->
    <text x="4" y="148" font-size="14.5" font-weight="700" fill="#64748B" letter-spacing="4" text-transform="uppercase">
      NEXT GEN ISP SOLUTION
    </text>

    <!-- Small Network Badge Pill -->
    <rect x="420" y="70" width="84" height="24" rx="12" ry="12" fill="rgba(2, 132, 199, 0.08)" stroke="#0284C7" stroke-width="1.2" stroke-opacity="0.3" />
    <circle cx="433" cy="82" r="3" fill="#10B981" />
    <text x="442" y="86" font-size="10" font-weight="800" fill="#0284C7" letter-spacing="1">CLOUD</text>
  </g>
</svg>