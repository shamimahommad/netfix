<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- 3D Extrusion Depth Gradients (The side walls of the 3D letter) -->
    <linearGradient id="tDepthLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="60%" stop-color="#0C4A6E" />
      <stop offset="100%" stop-color="#082F49" />
    </linearGradient>

    <linearGradient id="tDepthDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <linearGradient id="tDepthRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="60%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>

    <!-- Front Face Gradients (Glossy Metallic Neon) -->
    <linearGradient id="tFrontLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <linearGradient id="tFrontDiag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5F3FC" />
      <stop offset="20%" stop-color="#00F2FE" />
      <stop offset="55%" stop-color="#06B6D4" />
      <stop offset="85%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <linearGradient id="tFrontRight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="80%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>

    <!-- Chrome Bevel Highlight Gradients -->
    <linearGradient id="tBevelLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="tBevelEmerald" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A7F3D0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#34D399" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Node Sphere Shading -->
    <radialGradient id="tSphere3dCyan" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#67E8F9" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#083344" />
    </radialGradient>

    <radialGradient id="tSphere3dEmerald" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#A7F3D0" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#022C22" />
    </radialGradient>

    <!-- 3D Text Gradients -->
    <linearGradient id="tTextNet3d" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="tTextFix3d" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#00F2FE" />
      <stop offset="80%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="tDepthShadow3d" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="12" dy="24" stdDeviation="20" flood-color="#0284C7" flood-opacity="0.4" />
    </filter>

    <filter id="tNeonGlow3d" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .font-3d {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>

  <!-- NO background rect: 100% TRANSPARENT CANVAS -->

  <!-- ============================================================ -->
  <!-- EXACT NETFIX "N" EMBLEM (Crafted with 3D Bevels & Depth)    -->
  <!-- ============================================================ -->
  <g transform="translate(144, 40)" filter="url(#tDepthShadow3d)">

    <!-- 3D Isometric Extrusion Layer (Thickness = 22px down-right) -->
    <!-- Extrusion for Left Pillar -->
    <path d="M 132 154 C 132 136, 146 122, 164 122 L 180 142 C 162 142, 148 156, 148 174 L 148 378 L 196 378 L 196 358 L 212 378 L 212 388 C 212 406, 198 420, 180 420 C 162 420, 148 406, 148 388 Z" fill="url(#tDepthLeft)" opacity="0.95" />

    <!-- Extrusion for Diagonal Connector -->
    <path d="M 196 154 L 348 358 L 366 380 L 334 412 L 284 358 L 132 154 L 148 174 L 298 378 Z" fill="url(#tDepthDiag)" opacity="0.9" />

    <!-- Extrusion for Right Pillar -->
    <path d="M 316 154 L 332 174 L 332 378 L 380 378 L 396 398 L 396 174 C 396 156, 382 142, 364 142 L 348 122 Z" fill="url(#tDepthRight)" opacity="0.95" />
    <path d="M 380 358 C 380 376, 366 390, 348 390 L 364 412 C 382 412, 396 398, 396 380 Z" fill="url(#tDepthRight)" />

    <!-- Front Face - EXACT NETFIX "N" EMBLEM -->
    <!-- (A) Left Pillar -->
    <g>
      <path d="M 132 154
               C 132 136, 146 122, 164 122
               C 182 122, 196 136, 196 154
               L 196 358
               C 196 376, 182 390, 164 390
               C 146 390, 132 376, 132 358
               Z" 
            fill="url(#tFrontLeft)" />

      <!-- Glossy 3D Highlight Curve on Left Pillar -->
      <path d="M 136 154
               C 136 140, 148 128, 164 128
               L 164 384
               C 152 384, 142 374, 138 362
               L 138 160
               Z" 
            fill="url(#tBevelLight)" 
            opacity="0.85" />
      
      <line x1="164" y1="140" x2="164" y2="372" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    </g>

    <!-- (B) Dynamic Diagonal Connector -->
    <g>
      <path d="M 164 122
               C 182 122, 196 136, 196 154
               L 348 358
               C 348 376, 334 390, 316 390
               C 298 390, 284 376, 284 358
               L 132 154
               C 132 136, 146 122, 164 122
               Z"
            fill="url(#tFrontDiag)"
            filter="url(#tNeonGlow3d)" />

      <line x1="164" y1="126" x2="344" y2="362" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- (C) Right Pillar -->
    <g>
      <path d="M 316 154
               C 316 136, 330 122, 348 122
               C 366 122, 380 136, 380 154
               L 380 358
               C 380 376, 366 390, 348 390
               C 330 390, 316 376, 316 358
               Z" 
            fill="url(#tFrontRight)" />

      <path d="M 320 154
               C 320 140, 332 128, 348 128
               L 348 384
               C 336 384, 326 374, 322 362
               L 322 160
               Z" 
            fill="url(#tBevelEmerald)" 
            opacity="0.8" />

      <line x1="348" y1="140" x2="348" y2="372" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.75" />
    </g>

    <!-- (D) 3D Signal Broadcast Waves in Top-Right Corner -->
    <g filter="url(#tNeonGlow3d)">
      <path d="M 330 110 A 85 85 0 0 1 402 182" fill="none" stroke="#34D399" stroke-width="6.5" stroke-linecap="round" opacity="0.5" />
      <path d="M 345 125 A 65 65 0 0 1 387 167" fill="none" stroke="#00F2FE" stroke-width="7.5" stroke-linecap="round" opacity="0.85" />
      <path d="M 360 140 A 45 45 0 0 1 372 152" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
    </g>

    <!-- (E) 3D Optical Nodes -->
    <circle cx="164" cy="154" r="18" fill="url(#tSphere3dCyan)" />
    <circle cx="158" cy="148" r="5" fill="#FFFFFF" opacity="0.95" />

    <circle cx="348" cy="358" r="18" fill="url(#tSphere3dEmerald)" />
    <circle cx="342" cy="352" r="5" fill="#FFFFFF" opacity="0.95" />

    <!-- Center Laser Burst Accent -->
    <polygon points="256,230 262,250 282,256 262,262 256,282 250,262 230,256 250,250" fill="#FFFFFF" opacity="0.95" filter="url(#tNeonGlow3d)" />
    <circle cx="256" cy="256" r="4" fill="#FFFFFF" />

    <circle cx="164" cy="358" r="12" fill="url(#tSphere3dCyan)" />
    <circle cx="348" cy="154" r="12" fill="url(#tSphere3dEmerald)" />
  </g>

  <!-- ============================================================ -->
  <!-- 3D TYPOGRAPHY: NetFix & "NEXT GEN ISP SOLUTION"             -->
  <!-- ============================================================ -->
  <g class="font-3d" transform="translate(512, 650)" text-anchor="middle" filter="url(#tDepthShadow3d)">
    <!-- Main Wordmark -->
    <text x="-98" y="90" font-size="124" font-weight="900" fill="url(#tTextNet3d)" letter-spacing="-2">
      Net
    </text>
    <text x="96" y="90" font-size="124" font-weight="900" fill="url(#tTextFix3d)" filter="url(#tNeonGlow3d)" letter-spacing="-2">
      Fix
    </text>

    <!-- Glowing Pulse Dot on the "i" -->
    <circle cx="83" cy="2" r="10" fill="#00F2FE" />
    <circle cx="83" cy="2" r="5" fill="#FFFFFF" />
    <circle cx="83" cy="2" r="16" fill="none" stroke="#34D399" stroke-width="3" opacity="0.8" />

    <!-- Subtitle: NEXT GEN ISP SOLUTION (Pill Badge) -->
    <g transform="translate(0, 140)">
      <rect x="-210" y="0" width="420" height="44" rx="22" ry="22" fill="rgba(15, 23, 42, 0.85)" stroke="url(#tTextFix3d)" stroke-width="2" stroke-opacity="0.8" />
      <circle cx="-176" cy="22" r="5" fill="#10B981" filter="url(#tNeonGlow3d)" />
      <text x="-160" y="28" text-anchor="start" font-size="15" font-weight="800" fill="#F8FAFC" letter-spacing="4">
        NEXT GEN ISP SOLUTION
      </text>
    </g>
  </g>
</svg>